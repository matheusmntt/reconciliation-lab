# Proxy de borda do gateway (ADR 0011). Na rede internet, expõe apenas:
#   gateway-api  a API pública
#   gateway-s3   downloads por URL pré-assinada do bucket de relatórios
# Qualquer outro nome recebe 404.

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # DNS interno do Docker. Com o upstream em variável, o nome é resolvido a cada
  # requisição, e o nginx sobe mesmo que o serviço de destino ainda não exista.
  resolver 127.0.0.11 valid=10s ipv6=off;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  server {
    listen 80 default_server;
    return 404;
  }

  server {
    listen 80;
    server_name gateway-api;

    location / {
      set $upstream http://gateway-svc-api:3333;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name gateway-s3;

    # Somente leitura de objetos do bucket de relatórios, e só com assinatura na URL.
    # O Host é preservado porque faz parte da assinatura SigV4.
    location /gateway-settlement-reports/ {
      limit_except GET {
        deny all;
      }
      if ($args !~ "(^|&)X-Amz-Signature=") {
        return 403;
      }
      set $upstream http://gateway-floci:4566;
      proxy_pass $upstream;
      proxy_set_header Host $host;
    }

    location / {
      return 403;
    }
  }
}
