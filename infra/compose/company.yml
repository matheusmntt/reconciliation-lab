# Empresa: a infraestrutura que fica fora do Floci (spike 0001), ou seja, o Kafka
# e o Redis. O Floci da empresa, os bancos de dados e os serviços entram aqui
# quando o trabalho na empresa começar.

services:
  # Kafka interno (Redpanda), com schema registry. Versão fixa e volume durável,
  # porque os eventos não podem sumir num restart.
  company-kafka:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://company-kafka:9092,external://127.0.0.1:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr=internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr=internal://company-kafka:8082
      - --rpc-addr=company-kafka:33145
      - --advertise-rpc-addr=company-kafka:33145
    volumes:
      - company-kafka-data:/var/lib/redpanda/data
    networks: [internal]
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:18081:18081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Filas do BullMQ, idempotência e rate limit. Com AOF, porque as filas não
  # podem se perder num restart.
  company-redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - company-redis-data:/data
    networks: [internal]
    ports:
      - "127.0.0.1:6301:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  company-kafka-data:
  company-redis-data:
