# Gateway de pagamento (terceiro).
# - Conta AWS própria no Floci do gateway (ADRs 0005 e 0012).
# - Tudo na rede third-party-gateway. A rede internet só é alcançada pelo proxy
#   de borda e, quando existir, pelo papel worker (ADR 0011).
#
# Id da conta AWS de cada organização (um access key de 12 dígitos vira o id da
# conta no Floci): empresa 111111111111, gateway 222222222222,
# banco 333333333333, emissor 444444444444.

x-gateway-aws: &gateway-aws
  AWS_ENDPOINT_URL: http://gateway-floci:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: "222222222222"
  AWS_SECRET_ACCESS_KEY: gateway-dev

# Configuração comum a todos os papéis do gateway (api, worker, relay, scheduler).
x-gateway-app-env: &gateway-app-env
  <<: *gateway-aws
  DATABASE_URL: postgres://gateway:${GATEWAY_DB_PASSWORD:-gateway-dev}@gateway-floci:7101/gateway
  DATABASE_SECRET_ID: gateway/rds
  REDIS_URL: redis://gateway-redis:6379
  SIM_CLOCK_URL: redis://gateway:gateway-dev@sim-clock-redis:6379
  EVENT_BUS_NAME: gateway-domain
  WEBHOOK_EVENTS_QUEUE: webhook-events
  WEBHOOK_DELIVERY_QUEUE: webhook-delivery
  EVENTS_TABLE_NAME: gateway-events
  WEBHOOK_SECRETS_KMS_KEY: alias/gateway-webhook-secrets
  APPCONFIG_APPLICATION: sim
  APPCONFIG_ENVIRONMENT: scenario
  APPCONFIG_PROFILE: gateway

services:
  gateway-floci:
    image: floci/floci:2.1.0
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      FLOCI_HOSTNAME: gateway-floci
      FLOCI_DEFAULT_ACCOUNT_ID: "222222222222"
      FLOCI_DEFAULT_REGION: us-east-1
      # Tudo o que o Floci cria fica na rede privada do gateway.
      FLOCI_SERVICES_DOCKER_NETWORK: third-party-gateway
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: third-party-gateway
      FLOCI_SERVICES_ECS_DOCKER_NETWORK: third-party-gateway
      # Proxy TCP do RDS (primário e réplica). Cada organização usa uma faixa
      # própria, com a mesma porta dentro e fora do container: o Floci anuncia a
      # porta publicada no host como endpoint do RDS.
      FLOCI_SERVICES_RDS_ENDPOINT_HOST: gateway-floci
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7101"
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: "7102"
      # Redis e Kafka rodam em containers próprios, porque o ElastiCache e o MSK
      # do Floci não sobrevivem a um restart (spike 0001).
      FLOCI_SERVICES_ELASTICACHE_ENABLED: "false"
      FLOCI_SERVICES_MSK_ENABLED: "false"
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      # O Floci avalia as políticas IAM pelo access key informado, mas não confere
      # a assinatura SigV4. A credencial root (12 dígitos) tem acesso total, como
      # na AWS. Ver docs/spikes/0001-floci.md.
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
    volumes:
      # Necessário para o Floci criar o container do RDS.
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-floci-data:/app/data
    networks: [third-party-gateway]
    ports:
      - "127.0.0.1:4567:4566"
      - "127.0.0.1:7101-7102:7101-7102"

  # Rate limit e cache de autenticação. Os dados são descartáveis, por isso não
  # há persistência.
  gateway-redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [third-party-gateway]
    ports:
      - "127.0.0.1:6401:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Cria os recursos AWS da fase 1. É idempotente e roda a cada `up`.
  gateway-bootstrap:
    image: amazon/aws-cli:2.37.7
    entrypoint: ["bash", "/bootstrap/bootstrap.sh"]
    environment:
      <<: *gateway-aws
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway-dev}
    volumes:
      - ../bootstrap/gateway:/bootstrap:ro
    networks: [third-party-gateway]
    depends_on: [gateway-floci]
    restart: "no"

  # Ponto de entrada público do gateway na rede internet (ADR 0011).
  gateway-edge:
    image: nginx:1.30.5-alpine
    volumes:
      - ../edge/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      internet:
        aliases: [gateway-api, gateway-s3]
      third-party-gateway: {}
    ports:
      - "127.0.0.1:8080:80"

  # Papel api. Os demais papéis (worker, relay, scheduler) entram aqui quando existirem,
  # com o mesmo build e o mesmo x-gateway-app-env.
  gateway-svc-api:
    build:
      context: ../../services/third-parties/gateway
      target: dev
    environment:
      <<: *gateway-app-env
      PORT: "3333"
    networks: [third-party-gateway]
    depends_on:
      gateway-bootstrap:
        condition: service_completed_successfully
      gateway-redis:
        condition: service_healthy
      sim-clock-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    develop:
      watch:
        - action: sync
          path: ../../services/third-parties/gateway/src
          target: /app/src
        - action: rebuild
          path: ../../services/third-parties/gateway/package.json
        - action: rebuild
          path: ../../services/third-parties/gateway/pnpm-lock.yaml

volumes:
  gateway-floci-data:
